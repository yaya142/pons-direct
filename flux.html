<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux</title>
<meta name="description" content="Les tokens alertés par le bot sur les 24 dernières heures, avec leur market cap en direct — la page 🌊 du bot.">
<!--
  🌊 LE FLUX — les tokens alertés des 24 dernières heures, en direct.

  Sans serveur : le bot publie `flux.json` dans ce dépôt (voir
  `src/telegram/flux.ts`), la page le relit toutes les 20 s sur
  raw.githubusercontent.com. Chaque ligne ouvre la page ⚡ du token.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #ffffff; --fg: #111; --muted: #6b7280; --card: #f3f4f6; --up: #16a34a; --down: #dc2626; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1115; --fg: #f3f4f6; --muted: #9ca3af; --card: #1a1d24; } }
  :root[data-theme="dark"] { --bg: #0f1115; --fg: #f3f4f6; --muted: #9ca3af; --card: #1a1d24; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 24px; background: var(--tg-theme-bg-color, var(--bg)); color: var(--tg-theme-text-color, var(--fg)); font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .filtres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); background: transparent; }
  .chip.on { color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, var(--accent)); border-color: transparent; }
  .tri { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .tri button { background: none; border: none; color: var(--accent); font-size: 13px; padding: 0 4px; }
  .ligne { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; background: var(--tg-theme-secondary-bg-color, var(--card)); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; text-decoration: none; color: inherit; }
  .sym { font-weight: 700; font-size: 17px; }
  .lp { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .cap { font-weight: 700; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 13px; }
  .mult { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .etat { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .vide { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<h1>🌊 Flux · 24 h</h1>
<div class="filtres" id="filtres"></div>
<div class="tri">Tri : <button data-tri="age">plus récents</button> · <button data-tri="mult">× depuis l'alerte</button> · <button data-tri="cap">market cap</button></div>
<div id="liste"><div class="vide">chargement…</div></div>
<div class="etat" id="etat"></div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const SRC = "https://raw.githubusercontent.com/yaya142/pons-direct/main/flux.json";
  const NOMS = { ponsv2: "pons V2", uerc20: "pools.trade", long: "long.xyz", cashcat: "CashCat", o1: "o1", flapbnb: "flap", pons: "pons", gated: "gated", uniswap: "Uniswap" };
  const $ = (id) => document.getElementById(id);
  let donnees = null, filtre = "tous", tri = "age";
  try { filtre = localStorage.getItem("flux.filtre") || "tous"; tri = localStorage.getItem("flux.tri") || "age"; } catch (e) {}
  const fmtUsd = (v) => v === null ? "—" : v >= 1000 ? "$" + Math.round(v).toLocaleString("en-US") : "$" + v.toLocaleString("en-US", { maximumSignificantDigits: 3 });
  const age = (s) => s < 90 ? `${Math.round(s)} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toLocaleString("en-US", { maximumFractionDigits: 1 })} h`;
  const mult = (m) => m === null ? "" : `×${m.toLocaleString("en-US", { maximumFractionDigits: 2 })}`;

  function rendre() {
    if (!donnees) return;
    const lps = [...new Set(donnees.lignes.map((l) => l.launchpad || l.canal))];
    $("filtres").innerHTML = ["tous", ...lps].map((k) => `<button class="chip ${filtre === k ? "on" : ""}" data-f="${k}">${k === "tous" ? "Tous" : (NOMS[k] || k)}</button>`).join("");
    $("filtres").querySelectorAll(".chip").forEach((b) => b.onclick = () => { filtre = b.dataset.f; try { localStorage.setItem("flux.filtre", filtre); } catch (e) {} rendre(); });
    let lignes = donnees.lignes.filter((l) => filtre === "tous" || (l.launchpad || l.canal) === filtre);
    if (tri === "mult") lignes = [...lignes].sort((a, b) => (b.multipleAlerte ?? -1) - (a.multipleAlerte ?? -1));
    else if (tri === "cap") lignes = [...lignes].sort((a, b) => (b.capUsd ?? -1) - (a.capUsd ?? -1));
    else lignes = [...lignes].sort((a, b) => a.ageS - b.ageS);
    $("liste").innerHTML = lignes.length === 0 ? `<div class="vide">rien dans les 24 dernières heures</div>` : lignes.map((l) => {
      const m = l.multipleAlerte;
      const cls = m === null ? "" : m >= 1 ? "up" : "down";
      const v15 = l.variation15m === null ? "" : ` · 15 min ${l.variation15m >= 1 ? "+" : ""}${((l.variation15m - 1) * 100).toLocaleString("en-US", { maximumFractionDigits: 0 })} %`;
      const href = l.live || `https://dexscreener.com/${l.chaine === "bnb" ? "bsc" : l.chaine}/${l.token}`;
      return `<a class="ligne" href="${href}">
        <div><span class="sym">$${l.symbole || "?"}</span><span class="lp">${NOMS[l.launchpad || l.canal] || l.canal}${l.gradue ? " · 🎓" : ""}</span></div>
        <div class="cap">${fmtUsd(l.capUsd)}</div>
        <div class="sub">il y a ${age(l.ageS)}${l.picUsd !== null ? " · pic " + fmtUsd(l.picUsd) : ""}</div>
        <div class="mult ${cls}">${mult(m)}${v15}</div>
      </a>`;
    }).join("");
    const il = Math.max(0, Math.round(Date.now() / 1000 - donnees.maj));
    $("etat").textContent = `${lignes.length} token(s) · publié il y a ${age(il)} · la liste se relit toutes les 20 s, chaque ligne ouvre le direct ⚡`;
  }
  document.querySelectorAll("[data-tri]").forEach((b) => b.onclick = () => { tri = b.dataset.tri; try { localStorage.setItem("flux.tri", tri); } catch (e) {} rendre(); });
  async function charge() {
    try {
      const r = await fetch(`${SRC}?x=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      donnees = await r.json();
      rendre();
    } catch (e) {
      $("etat").textContent = `lecture impossible — ${String(e.message || e)} · nouvel essai dans 20 s`;
      if (!donnees) $("liste").innerHTML = `<div class="vide">le flux n'est pas encore publié</div>`;
    }
  }
  charge();
  setInterval(charge, 20_000);
})();
</script>
</body>
</html>
